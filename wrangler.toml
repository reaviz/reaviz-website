name = "reaviz-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages output of `@cloudflare/next-on-pages` (run via `build:cloudflare`).
# Must be a top-level key — anything after a `[table]` header below would be parsed
# as part of that table, so keep this above `[vars]`.
pages_build_output_dir = ".vercel/output/static"

[vars]
NODE_ENV = "production"
